name: Compilar APK de BabyTrack Android

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Leer versión del proyecto
        id: meta
        run: |
          APP_VER=$(node -p "require('./package.json').version")
          APP_CODE=$(node -p "require('./package.json').androidVersionCode || 1")
          IS_PRE=$( [[ "$APP_VER" == 0.* || "$APP_VER" == *-* ]] && echo "true" || echo "false" )
          echo "version=$APP_VER" >> "$GITHUB_OUTPUT"
          echo "code=$APP_CODE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$IS_PRE" >> "$GITHUB_OUTPUT"

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Configurar Java 21 (requerido por Capacitor 7 / SDK 35)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Instalar dependencias y compilar assets web offline
        run: |
          npm ci
          chmod +x scripts/build-web.sh
          ./scripts/build-web.sh
          npx cap sync android

      - name: Ejecutar pruebas de lógica obstétrica, versiones y exportación
        run: npm test

      - name: Restaurar llave de firma fija (evita conflictos de actualización en Android)
        env:
          KEYSTORE_B64: ${{ secrets.BABYTRACK_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "Keystore fijo restaurado correctamente."
            echo "=== Huella pública del certificado Android (para Google Cloud Console OAuth) ==="
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:" || true
          fi

      - name: Compilar APK de pruebas (assembleDebug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK listo para instalar y rollback
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/BabyTrack-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/BabyTrack-v${{ steps.meta.outputs.version }}-debug.apk"

      - name: Subir APK como Artefacto de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: BabyTrack-Android-APK-v${{ steps.meta.outputs.version }}
          path: dist/BabyTrack-v${{ steps.meta.outputs.version }}-debug.apk
          retention-days: 90

      - name: Actualizar última compilación móvil (latest-apk en pushes a main)
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "BabyTrack Android APK (Última compilación · v${{ steps.meta.outputs.version }})"
          body: |
            Última compilación automática desde `main` (`v${{ steps.meta.outputs.version }}`, Android `versionCode ${{ steps.meta.outputs.code }}`).
            Compatible con Android 6.0 hasta Android 14 (MagicOS 8) y 15.
          files: dist/BabyTrack-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar Release histórico versionado (tags v* para rollback)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: "BabyTrack v${{ steps.meta.outputs.version }} (build ${{ steps.meta.outputs.code }})"
          body: |
            Versión etiquetada `${{ github.ref_name }}` (`versionCode ${{ steps.meta.outputs.code }}`).
            Consulta todos los cambios en `CHANGELOG.md`. Este APK permanece guardado de forma permanente por si necesitas hacer rollback.
          files: dist/BabyTrack-v${{ steps.meta.outputs.version }}-debug.apk
          prerelease: ${{ steps.meta.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
