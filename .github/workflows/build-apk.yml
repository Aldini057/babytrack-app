name: Compilar APK de BabyTrack Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Configurar Java 21 (requerido por Capacitor 7 / SDK 35)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Instalar dependencias y compilar assets web offline
        run: |
          npm ci
          chmod +x scripts/build-web.sh
          ./scripts/build-web.sh
          npx cap sync android

      - name: Ejecutar pruebas de lógica obstétrica y exportación
        run: npm test

      - name: Compilar APK de pruebas (assembleDebug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK listo para instalar
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/BabyTrack-debug.apk

      - name: Subir APK como Artefacto de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: BabyTrack-Android-APK
          path: dist/BabyTrack-debug.apk
          retention-days: 30

      - name: Publicar última compilación en Releases (descarga directa 1 toque)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "BabyTrack Android APK (Última compilación)"
          body: |
            Descarga directa del archivo `.apk` compilado automáticamente desde `main`.
            Compatible con Android 6.0 hasta Android 14 (MagicOS 8) y 15.
          files: dist/BabyTrack-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
